data:
  _target_: nequip.data.datamodule.ASEDataModule
  exclude_keys:
  - weight
  seed: 42
  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 1
    num_workers: 4
    shuffle: true
  train_file_path: /scratch/lz432/mlip_Si_pbe/learning_curves_multiseed/entropy_n0100_s42/train.xyz
  transforms:
  - _target_: nequip.data.transforms.NeighborListTransform
    r_max: 7
  - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
    chemical_species_to_atom_type_map:
      Si: Si
    model_type_names:
    - H
    - He
    - Li
    - Be
    - B
    - C
    - N
    - O
    - F
    - Ne
    - Na
    - Mg
    - Al
    - Si
    - P
    - S
    - Cl
    - Ar
    - K
    - Ca
    - Sc
    - Ti
    - V
    - Cr
    - Mn
    - Fe
    - Co
    - Ni
    - Cu
    - Zn
    - Ga
    - Ge
    - As
    - Se
    - Br
    - Kr
    - Rb
    - Sr
    - Y
    - Zr
    - Nb
    - Mo
    - Tc
    - Ru
    - Rh
    - Pd
    - Ag
    - Cd
    - In
    - Sn
    - Sb
    - Te
    - I
    - Xe
    - Cs
    - Ba
    - La
    - Ce
    - Pr
    - Nd
    - Pm
    - Sm
    - Eu
    - Gd
    - Tb
    - Dy
    - Ho
    - Er
    - Tm
    - Yb
    - Lu
    - Hf
    - Ta
    - W
    - Re
    - Os
    - Ir
    - Pt
    - Au
    - Hg
    - Tl
    - Pb
    - Bi
    - Po
    - At
    - Rn
    - Fr
    - Ra
    - Ac
    - Th
    - Pa
    - U
    - Np
    - Pu
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 1
    num_workers: 4
  val_file_path: /scratch/lz432/mlip_Si_pbe/data/curated/si_pbe/val.xyz
run:
- train
- val
trainer:
  _target_: lightning.Trainer
  accelerator: gpu
  accumulate_grad_batches: 4
  callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: /scratch/lz432/mlip_Si_pbe/learning_curves_multiseed/entropy_n0100_s42/checkpoints
    filename: best
    mode: min
    monitor: val0_epoch/weighted_sum
    save_last: true
    save_top_k: 1
    verbose: true
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    min_delta: 1.0e-05
    monitor: val0_epoch/weighted_sum
    patience: 30
    verbose: true
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  check_val_every_n_epoch: 1
  devices: 1
  enable_checkpointing: true
  gradient_clip_val: 0.015
  log_every_n_steps: 10
  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    name: entropy_n0100_s42
    save_dir: /scratch/lz432/mlip_Si_pbe/learning_curves_multiseed
  max_epochs: 200
  precision: 32
training_module:
  _target_: nequip.train.EMALightningModule
  ema_decay: 0.999
  loss:
    _target_: nequip.train.MetricsManager
    metrics:
    - coeff: 1.0
      field:
        _target_: nequip.data.PerAtomModifier
        field: total_energy
      metric:
        _target_: nequip.train.HuberLoss
        delta: 0.01
      name: energy
    - coeff: 1.0
      field: forces
      metric:
        _target_: nequip.train.HuberLoss
        delta: 0.01
      name: forces
    - coeff: 0.01
      field: stress
      metric:
        _target_: nequip.train.HuberLoss
        delta: 0.1
      name: stress
  lr_scheduler:
    frequency: 1
    interval: epoch
    monitor: val0_epoch/weighted_sum
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      factor: 0.5
      min_lr: 1.0e-06
      patience: 15
  model:
    _target_: nequip.model.ModelFromPackage
    compile_mode: eager
    package_path: /scratch/lz432/allegro_finetune/allegro-oam-l.nequip.zip
  optimizer:
    _target_: torch.optim.Adam
    lr: 5.0e-05
    weight_decay: 1.0e-08
  train_metrics: ${training_module.val_metrics}
  val_metrics:
    _target_: nequip.train.EnergyForceStressMetrics
    coeffs:
      forces_mae: 3.0
      forces_rmse: 1.0
      per_atom_energy_mae: 10.0
      per_atom_energy_rmse: 2.0
      stress_mae: 1.0
      stress_rmse: 0.5
