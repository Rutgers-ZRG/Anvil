# r2SCAN+rVV10 INCAR template. Used for carbon (BPARAM=11.95).
# Reference: Ning et al., PRB 106, 075422 (2022).

incar:
  SYSTEM: "Anvil r2SCAN+rVV10 single-point"
  PREC: Accurate
  ENCUT: 600
  EDIFF: 1.0e-6
  NSW: 0
  ISIF: 2
  ISMEAR: 0
  SIGMA: 0.05
  METAGGA: R2SCAN
  LUSE_VDW: .TRUE.
  BPARAM: 11.95                  # r2SCAN+rVV10 (NOT 6.3, NOT 14.0)
  LASPH: .TRUE.                  # required for meta-GGA
  LWAVE: .FALSE.
  LCHARG: .FALSE.
  NELM: 200
  NPAR: 4                        # carbon r2SCAN+rVV10 needs this for convergence
  LREAL: .FALSE.
  LPLANE: .FALSE.

slurm:
  # NOTE: "price" exists on amareln but NOT on amarel3. Falling back to "main"
  # only works on both clusters; users wanting the price partition can
  # override via dft.extra_incar / a custom slurm yaml.
  partition: "main"
  ntasks: 32
  mem: "64G"
  time: "03:00:00"
  # No module_loads here on purpose: the compiler module is a property of the
  # cluster, not of the functional. amareln has intel/17.0.4, amarel3 only
  # 16.0.3 / 17.0.2 / 18.0.5 — the cluster registry supplies the right one.
  # Override per run with dft.engine_options.slurm.module_loads if needed.

stress_convention: ase
