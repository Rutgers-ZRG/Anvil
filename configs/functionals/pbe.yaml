# PBE INCAR template. Used for Si, NaCl in this paper's runs.
# Comments document the choices; Anvil's VASP module expands {placeholders}.

incar:
  SYSTEM: "Anvil PBE single-point"
  PREC: Accurate
  ENCUT: 600                     # user can override via dft.encut
  EDIFF: 1.0e-6
  NSW: 0                         # single-point — no relaxation
  ISIF: 2                        # compute stress at fixed cell
  ISMEAR: 0                      # Gaussian smearing
  SIGMA: 0.05
  GGA: PE
  LASPH: .TRUE.
  LWAVE: .FALSE.
  LCHARG: .FALSE.
  NELM: 200
  LREAL: .FALSE.                 # PI preference: never LREAL=Auto
  LPLANE: .FALSE.

slurm:
  partition: "main"
  ntasks: 32
  mem: "64G"
  time: "03:00:00"
  # No module_loads here on purpose: the compiler module is a property of the
  # cluster, not of the functional. amareln has intel/17.0.4, amarel3 only
  # 16.0.3 / 17.0.2 / 18.0.5 — the cluster registry supplies the right one.
  # Override per run with dft.engine_options.slurm.module_loads if needed.

stress_convention: ase           # compression-negative, matches predictions
