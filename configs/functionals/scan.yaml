# Plain SCAN INCAR template (no rVV10).

incar:
  SYSTEM: "Anvil SCAN single-point"
  PREC: Accurate
  ENCUT: 600
  EDIFF: 1.0e-6
  NSW: 0
  ISIF: 2
  ISMEAR: 0
  SIGMA: 0.05
  METAGGA: SCAN
  LASPH: .TRUE.
  LWAVE: .FALSE.
  LCHARG: .FALSE.
  NELM: 200
  LREAL: .FALSE.
  LPLANE: .FALSE.

slurm:
  partition: "main"
  ntasks: 32
  mem: "64G"
  time: "03:00:00"
  # No module_loads here on purpose: the compiler module is a property of the
  # cluster, not of the functional. amareln has intel/17.0.4, amarel3 only
  # 16.0.3 / 17.0.2 / 18.0.5 — the cluster registry supplies the right one.
  # Override per run with dft.engine_options.slurm.module_loads if needed.

stress_convention: ase
